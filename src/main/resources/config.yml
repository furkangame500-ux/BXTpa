# BXTpa yapılandırması
version: ${version}
language: tr_TR
debug: false

# TPA isteğinin geçerlilik süresi (saniye)
delay:
  accept: 30
  enable_teleport: true
  enable_command: true

  # Işınlanma öncesi bekleme süreleri (saniye)
  default:
    teleport: 5
    command: 30
  vip:
    teleport: 5
    command: 25
  vip+:
    teleport: 5
    command: 20
  mvp:
    teleport: 5
    command: 15
  mvp+:
    teleport: 5
    command: 10
  mvp++:
    teleport: 5
    command: 5
  admin:
    teleport: 5
    command: 0

# TPA komutları
tpa:
  enable: true
  permission: false

tphere:
  enable: true
  permission: false

# Görsel ve ses ayarları
enable_title_message: true
enable_sound: true

sound:
  countdown:
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0
  success:
    name: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  fail:
    name: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  cancel:
    name: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 1.0

# TPA ücret sistemi. Kapalı bırakılırsa tüm TPA işlemleri ücretsizdir.
cost:
  enable: false
  currency: money
  price:
    tpa: 0
    tphere: 0
  discount_mode: percent
  vip_discount:
    vip: 50
    vip+: 30
    mvp: 20
    mvp+: 10
    mvp++: 5

# Geyser/Floodgate varsa TPA istekleri için butonlu pencere kullanılabilir.
bedrock:
  teleport_request_form: true

# Güncelleme kontrolü BXTpa'da kapalıdır.
update_check: false
use_database: false
database_type: sqlite
database_address: localhost
database_port: 3306
database_name: bxtpa
database_username: root
database_password: ""
force_spawn: false
