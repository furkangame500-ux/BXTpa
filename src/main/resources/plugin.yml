name: BXTpa
version: 1.0.0
main: com.bxtpa.BXTpa
api-version: '1.20'
author: BXT
description: Lightweight and customizable TPA (Teleport Request) plugin.
commands:
  tpa:
    description: Send a teleport request to a player.
    usage: /tpa <player>
  tphere:
    description: Request a player to teleport to you.
    usage: /tphere <player>
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept
  tpdeny:
    description: Deny a teleport request.
    usage: /tpdeny
permissions:
  bxtpa.use:
    description: Allows using BXTpa commands.
    default: true
